[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dextrusion"
version = "1.0.0"
description = "Detection of cellular events (extrusion, division, SOP...) in 2D+t epithelial movies with a CNN-GRU (PyTorch/MONAI port of DeXtrusion)."
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "alvillars" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "tifffile>=2024.1.30",
    "roifile>=2024.1.10",
    "torch>=2.3",
    "monai>=1.3",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# Only needed to read legacy Keras SavedModels inside this environment.
# `dextrusion convert` works without it (it uses an isolated `uv run` env).
convert = ["tensorflow-cpu>=2.12"]

[project.scripts]
dextrusion = "dextrusion.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/dextrusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that need external data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
